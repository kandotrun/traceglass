[package]
name = "traceglass"
version = "0.1.0"
edition = "2024"
publish = false
repository = "https://github.com/kandotrun/traceglass"
description = "A browser-based event explorer built with Rust, GPUI Kit, and WebAssembly."

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]
members = ["crates/event-core"]
resolver = "2"

[dependencies]
event-core = { path = "crates/event-core" }
gpui-kit = "=0.7.3"
wasm-bindgen = "=0.2.121"
web-sys = { version = "0.3", features = ["Window", "Performance", "Document", "Element", "HtmlInputElement"] }
serde_json = "1"
console_error_panic_hook = "0.1"
console_log = "1"
log = "0.4"

[profile.dev]
debug = 0

[profile.release]
opt-level = "s"
lto = "thin"
strip = "symbols"

[profile.release.package.event-core]
opt-level = 3
