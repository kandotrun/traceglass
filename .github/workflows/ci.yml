name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Core tests and WebAssembly build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install the pinned Rust toolchain
        # rustup reads the version and targets from rust-toolchain.toml.
        run: rustup show active-toolchain

      - name: Test the event engine
        run: npm run check

      - name: Install the matching WebAssembly bindings CLI
        run: cargo install wasm-bindgen-cli --version 0.2.121 --locked

      - name: Build the browser application
        run: npm run build
